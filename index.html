<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث عن مجموعات واتساب v2 - أبو نواف</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; padding: 40px; text-align: center; }
    .logo { width: 80px; height: 80px; margin: 0 auto 20px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .content { padding: 40px; }
    .input-group { margin-bottom: 30px; }
    label { display: block; margin-bottom: 10px; font-weight: bold; color: #128C7E; }
    input { width: 100%; padding: 15px; border: 2px solid #d1fae5; border-radius: 10px; font-size: 1em; }
    button { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; border: none; padding: 15px 40px; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
    .results { margin-top: 30px; display: none; }
    .results.show { display: block; }
    .group-card { background: #f0fdf4; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-right: 4px solid #25D366; display: flex; justify-content: space-between; align-items: center; }
    .group-card a { background: #25D366; color: white; padding: 8px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .stat { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-number { font-size: 2em; font-weight: bold; }
    .footer { background: #1e293b; color: white; padding: 30px; text-align: center; }
    .badge { display: inline-block; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; margin: 5px; }
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.show { display: block; }
    .spinner { border: 4px solid #d1fae5; border-top: 4px solid #25D366; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="50" height="50" viewBox="0 0 100 100">
          <path d="M50 5 L90 25 L90 60 Q90 85 50 95 Q10 85 10 60 L10 25 Z" fill="#25D366"/>
          <text x="50" y="60" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AN</text>
        </svg>
      </div>
      <h1>📱 البحث عن مجموعات واتساب v2</h1>
      <p>ابحث عن مجموعات واتساب عامة في أي موضوع</p>
    </div>
    
    <div class="content">
      <div class="input-group">
        <label>موضوع البحث</label>
        <input type="text" id="query" placeholder="مثال: كرة القدم، تقنية، تعليم..." />
      </div>
      
      <button onclick="search()" id="searchBtn">🔍 بحث عن مجموعات</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>جاري البحث في محركات متعددة...</p>
      </div>
      
      <div class="results" id="results"></div>
    </div>
    
    <div class="footer">
      <div style="display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:20px;">
        <svg width="50" height="50" viewBox="0 0 100 100">
          <path d="M50 5 L90 25 L90 60 Q90 85 50 95 Q10 85 10 60 L10 25 Z" fill="#25D366"/>
          <text x="50" y="60" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AN</text>
        </svg>
        <div>
          <div style="font-size:1.2em;font-weight:bold;">أبو نواف - هكر أخلاقي</div>
          <div style="color:#94a3b8;">أدوات OSINT متقدمة</div>
        </div>
      </div>
      <span class="badge">🛡️ هكر أخلاقي</span>
      <span class="badge">📱 واتساب</span>
      <span class="badge">⚡ سريع</span>
    </div>
  </div>
  
  <script>
    async function search() {
      const query = document.getElementById('query').value.trim();
      if (!query) { alert('الرجاء إدخال موضوع البحث'); return; }
      
      const btn = document.getElementById('searchBtn');
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      
      btn.disabled = true;
      loading.classList.add('show');
      results.classList.remove('show');
      
      try {
        const response = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await response.json();
        
        let html = '<div class="stats">';
        html += '<div class="stat"><div class="stat-number">' + data.total + '</div><div>مجموعة</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.google || 0) + '</div><div>Google</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.bing || 0) + '</div><div>Bing</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.duckduckgo || 0) + '</div><div>DuckDuckGo</div></div>';
        html += '</div>';
        
        if (data.groups && data.groups.length > 0) {
          html += '<h3 style="margin:20px 0;">المجموعات الموجودة:</h3>';
          data.groups.forEach(g => {
            html += '<div class="group-card">';
            html += '<div>';
            html += '<div style="font-weight:bold;font-size:1.1em;">' + g.name + '</div>';
            html += '<div style="color:#64748b;font-size:0.9em;margin-top:5px;">المصدر: ' + (g.source || 'غير معروف') + '</div>';
            html += '</div>';
            html += '<a href="' + g.inviteLink + '" target="_blank">انضم</a>';
            html += '</div>';
          });
        } else {
          html += '<p style="text-align:center;padding:20px;color:#64748b;">لم يتم العثور على مجموعات</p>';
        }
        
        results.innerHTML = html;
        results.classList.add('show');
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }
  </script>
</body>
</html>
